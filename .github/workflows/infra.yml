name: Preview or provision infrastructure
on:
  workflow_dispatch:
    inputs:
      plane: {type: choice, options: [staging, production], required: true}
      apply: {type: boolean, description: 'Request protected approval after preview', default: false}
permissions:
  contents: read
jobs:
  preview:
    if: vars.INFRA_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: infra-plan-${{ inputs.plane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, id-token: write}
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: plan
        env:
          PLANE: ${{ inputs.plane }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: bash scripts/infra-plan.sh preview
  apply:
    needs: preview
    if: inputs.apply
    environment: infra-apply-${{ inputs.plane }}
    concurrency:
      group: mutate-${{ inputs.plane }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    env:
      PLANE: ${{ inputs.plane }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reject drift since preview, then apply the same incremental template
        env:
          APPROVED_PLAN: ${{ needs.preview.outputs.fingerprint }}
        run: bash scripts/infra-plan.sh apply
