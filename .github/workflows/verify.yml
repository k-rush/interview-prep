name: Verify
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release policy and workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/check-release.test.mjs
          bash scripts/test-infra-plan.sh
          file="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$file" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $file" | sha256sum -c -
          tar -xzf "$file" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Application CI and no-cost agent replays
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./dev.ps1 test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./dev.ps1 eval replay
